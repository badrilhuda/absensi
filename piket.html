<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f5b">

<title>Absensi Guru Piket - MTs. Badril Huda</title>

<style>

/* ==========================================================
   RESET
========================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f1f7f5;
  color: #173f35;
}

body {
  min-height: 100vh;
}

.app {
  width: 100%;
  max-width: 900px;
  min-height: 100vh;
  margin: auto;
  background: #f1f7f5;
}


/* ==========================================================
   HEADER
========================================================== */

.header {
  min-height: 145px;
  padding: 28px 25px;
  display: flex;
  align-items: center;
  gap: 18px;

  background: linear-gradient(
    135deg,
    #087f5b,
    #0b986f
  );

  color: #fff;

  position: relative;
  overflow: hidden;
}


/* LENGKUNGAN HEADER */

.header::after {
  content: "";

  position: absolute;

  left: -20%;
  right: -20%;

  bottom: -105px;

  height: 145px;

  background: #f1f7f5;

  border-radius: 50% 50% 0 0 / 100% 100% 0 0;

  pointer-events: none;

  z-index: 1;
}


/* ==========================================================
   LOGO
========================================================== */

.header-icon {
  width: 96px;
  height: 96px;

  flex: 0 0 96px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 24px;

  background: rgba(255,255,255,.16);

  overflow: hidden;

  position: relative;
  z-index: 3;
}

.header-icon img {
  width: 84px;
  height: 84px;

  object-fit: contain;
}


/* ==========================================================
   JUDUL
========================================================== */

.header-text {
  position: relative;
  z-index: 3;
}

.header-text h1 {
  margin: 0 0 6px;

  font-size: clamp(
    30px,
    6vw,
    52px
  );

  line-height: 1;

  font-weight: 900;

  letter-spacing: .5px;
}

.header-text p {
  margin: 0;

  font-size: clamp(
    17px,
    3vw,
    25px
  );
}


/* ==========================================================
   JUDUL HALAMAN
========================================================== */

.page-title {
  padding: 34px 28px 18px;

  text-align: center;
}

.page-title h2 {
  margin: 0;

  color: #087f5b;

  font-size: clamp(
    30px,
    6vw,
    42px
  );

  font-weight: 900;
}

.page-title span {
  display: block;

  margin-top: 8px;

  color: #71807c;

  font-size: 17px;
}


/* ==========================================================
   KARTU HARI
========================================================== */

.day-card {
  margin: 10px 24px 18px;

  padding: 22px 20px;

  background: #fff;

  border-radius: 26px;

  text-align: center;

  box-shadow:
    0 8px 28px rgba(0,0,0,.06);
}

#hariIni {
  color: #087f5b;

  font-size: 34px;

  font-weight: 900;

  margin-bottom: 8px;
}

#tanggalHariIni {
  color: #71807c;

  font-size: 20px;
}


/* ==========================================================
   STATUS GPS
========================================================== */

.gps-box {
  margin: 0 24px 18px;

  padding: 16px 18px;

  background: #fff;

  border-radius: 18px;

  box-shadow:
    0 6px 20px rgba(0,0,0,.05);

  text-align: center;
}

.gps-title {
  color: #087f5b;

  font-size: 16px;

  font-weight: 900;

  margin-bottom: 6px;
}

#gpsStatus {
  color: #71807c;

  font-size: 14px;

  line-height: 1.5;
}


/* ==========================================================
   PESAN
========================================================== */

.message {
  margin: 0 24px 18px;

  padding: 15px 18px;

  border-radius: 16px;

  font-size: 15px;

  line-height: 1.5;

  display: none;
}

.message.success {
  display: block;

  background: #e4f8ed;

  color: #087f5b;
}

.message.error {
  display: block;

  background: #ffe8e8;

  color: #d62828;
}

.message.info {
  display: block;

  background: #eaf3ff;

  color: #1769aa;
}


/* ==========================================================
   DAFTAR GURU
========================================================== */

#daftarPiket {
  padding-bottom: 20px;
}

.guru-card {
  margin: 0 24px 16px;

  padding: 22px;

  background: #fff;

  border-radius: 22px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.06);
}

.guru-name {
  color: #075f49;

  font-size: 23px;

  font-weight: 900;

  line-height: 1.25;

  margin-bottom: 6px;
}

.guru-jabatan {
  color: #71807c;

  font-size: 16px;

  margin-bottom: 14px;
}

.guru-status {
  color: #8a9793;

  font-size: 15px;

  font-weight: 700;
}


/* ==========================================================
   TOMBOL ABSEN
========================================================== */

.absen-button {
  width: 100%;

  min-height: 52px;

  margin-top: 16px;

  border: 0;

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      #087f5b,
      #0b986f
    );

  color: #fff;

  font-size: 16px;

  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 5px 15px rgba(
      8,
      127,
      91,
      .18
    );
}

.absen-button:active {
  transform: scale(.98);
}

.absen-button:disabled {
  background: #b7c4c0;

  box-shadow: none;

  cursor: not-allowed;
}


/* ==========================================================
   TOMBOL GPS
========================================================== */

.gps-button {
  width: 100%;

  min-height: 52px;

  margin-top: 12px;

  border: 1px solid #cfe0da;

  border-radius: 14px;

  background: #fff;

  color: #087f5b;

  font-size: 15px;

  font-weight: 900;

  cursor: pointer;
}

.gps-button:active {
  transform: scale(.98);
}


/* ==========================================================
   LOADING
========================================================== */

.loading {
  margin: 0 24px 20px;

  padding: 30px 15px;

  background: #fff;

  border-radius: 18px;

  text-align: center;

  color: #71807c;

  display: none;
}


/* ==========================================================
   PESAN KOSONG
========================================================== */

.empty-box {
  margin: 0 24px 20px;

  padding: 30px 15px;

  background: #fff;

  border-radius: 18px;

  text-align: center;

  color: #71807c;
}


/* ==========================================================
   FOOTER
========================================================== */

footer {
  text-align: center;

  padding: 20px 20px 35px;

  color: #83908c;

  font-size: 13px;
}

footer strong {
  display: block;

  color: #087f5b;

  margin-bottom: 4px;
}


/* ==========================================================
   MOBILE
========================================================== */

@media (max-width: 600px) {

  .header {
    min-height: 138px;

    padding:
      24px 18px;

    gap: 14px;
  }

  .header-icon {
    width: 78px;
    height: 78px;

    flex-basis: 78px;

    border-radius: 20px;
  }

  .header-icon img {
    width: 70px;
    height: 70px;
  }

  .header-text h1 {
    font-size: 29px;
  }

  .header-text p {
    font-size: 17px;
  }

  .header::after {
    bottom: -105px;
    height: 145px;
  }

  .page-title {
    padding:
      28px 20px 16px;
  }

  .day-card {
    margin:
      8px 14px 16px;

    padding:
      20px 15px;

    border-radius: 22px;
  }

  #hariIni {
    font-size: 30px;
  }

  #tanggalHariIni {
    font-size: 18px;
  }

  .gps-box {
    margin:
      0 14px 16px;
  }

  .message {
    margin:
      0 14px 16px;
  }

  .guru-card {
    margin:
      0 14px 15px;

    padding: 19px;

    border-radius: 20px;
  }

  .guru-name {
    font-size: 21px;
  }

  .guru-jabatan {
    font-size: 15px;
  }

}


/* ==========================================================
   ANIMASI
========================================================== */

@keyframes muncul {

  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

.guru-card {
  animation:
    muncul .25s ease;
}


/* ==========================================================
   PRINT
========================================================== */

@media print {

  .gps-box,
  .gps-button,
  .absen-button,
  .message {
    display: none !important;
  }

  .guru-card {
    box-shadow: none;

    border: 1px solid #ddd;
  }

  .header {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

}

</style>
</head>


<body>

<div class="app">

    <div class="header-icon">

      <img
        src="https://drive.google.com/thumbnail?id=17TLa9x9TYyBQLGVx-d7DlWrNsAVE-v8e&sz=w300"

      >

    <div class="header-text">

    </div>

  </header>



  <!-- ======================================================

  ======================================================= -->

  <section class="page-title">

</div>


<!-- ========================================================
     JAVASCRIPT PIKET
========================================================= -->

<script src="piket.js"></script>


<!-- ========================================================
     FUNGSI DASAR GPS
========================================================= -->

<script>

let lokasiGPS = null;


/* ==========================================================
   CEK GPS
========================================================== */

function cekGPS() {

  const status =
    document.getElementById(
      'gpsStatus'
    );

  const button =
    document.getElementById(
      'gpsButton'
    );


  if (!navigator.geolocation) {

    status.innerHTML =
      '❌ Browser ini tidak mendukung GPS.';

    return;

  }


  status.innerHTML =
    '⏳ Mengambil lokasi GPS...';


  button.disabled = true;

  button.innerHTML =
    '⏳ MENGAMBIL LOKASI...';


  navigator.geolocation.getCurrentPosition(

    function(position) {

      lokasiGPS = {

        latitude:
          position.coords.latitude,

        longitude:
          position.coords.longitude,

        accuracy:
          position.coords.accuracy

      };


      status.innerHTML =
        '✅ GPS aktif.<br>' +
        'Akurasi: ' +
        Math.round(
          position.coords.accuracy
        ) +
        ' meter';


      button.disabled = false;

      button.innerHTML =
        '🔄 PERBARUI LOKASI';

    },


    function(error) {

      lokasiGPS = null;


      let pesan =
        '❌ Lokasi GPS tidak dapat diperoleh.';


      if (error.code === 1) {

        pesan =
          '❌ Izin lokasi ditolak. ' +
          'Silakan izinkan akses lokasi pada browser.';

      }

      else if (error.code === 2) {

        pesan =
          '❌ Lokasi tidak tersedia. ' +
          'Pastikan GPS aktif.';

      }

      else if (error.code === 3) {

        pesan =
          '❌ Waktu pengambilan lokasi habis. ' +
          'Silakan coba lagi.';

      }


      status.innerHTML = pesan;


      button.disabled = false;

      button.innerHTML =
        '📍 COBA LAGI';

    },

    {

      enableHighAccuracy: true,

      timeout: 15000,

      maximumAge: 0

    }

  );

}


/* ==========================================================
   TANGGAL
========================================================== */

(function() {

  const hari = [

    'MINGGU',
    'SENIN',
    'SELASA',
    'RABU',
    'KAMIS',
    'JUMAT',
    'SABTU'

  ];


  const sekarang =
    new Date();


  const namaHari =
    hari[
      sekarang.getDay()
    ];


  const tanggal =
    sekarang.toLocaleDateString(
      'id-ID',
      {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      }
    );


  const hariElement =
    document.getElementById(
      'hariIni'
    );


  const tanggalElement =
    document.getElementById(
      'tanggalHariIni'
    );


  if (hariElement) {

    hariElement.textContent =
      namaHari;

  }


  if (tanggalElement) {

    tanggalElement.textContent =
      tanggal;

  }

})();


/* ==========================================================
   FUNGSI BANTU UNTUK PIKET.JS
========================================================== */

function tampilkanPesan(
  pesan,
  tipe
) {

  const box =
    document.getElementById(
      'rekapMessage'
    );


  if (!box) return;


  box.className =
    'message ' +
    (
      tipe ||
      'info'
    );


  box.innerHTML =
    pesan || '';

}


function sembunyikanPesan() {

  const box =
    document.getElementById(
      'rekapMessage'
    );


  if (!box) return;


  box.className =
    'message';


  box.innerHTML =
    '';

}


/* ==========================================================
   INFORMASI GPS UNTUK PIKET.JS
========================================================== */

function getLokasiGPS() {

  return lokasiGPS;

}


/* ==========================================================
   VALIDASI GPS
========================================================== */

function gpsSiap() {

  return (
    lokasiGPS !== null &&
    Number.isFinite(
      lokasiGPS.latitude
    ) &&
    Number.isFinite(
      lokasiGPS.longitude
    )
  );

}

</script>
