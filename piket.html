<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>ABSENSI GURU PIKET</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f1f7f5;
  font-family:Arial,Helvetica,sans-serif;
  color:#173f35;
  overflow-x:hidden;
}

.container{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:0 16px 30px;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  width:calc(100% + 32px);
  margin-left:-16px;
  padding:28px 20px 34px;
  background:linear-gradient(135deg,#087f5b,#0b986f);
  color:white;
  text-align:center;
  border-radius:0 0 45% 45% / 0 0 28px 28px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.header h1{
  margin:0;
  font-size:30px;
  line-height:1.15;
  font-weight:900;
}

.header p{
  margin:8px 0 0;
  font-size:18px;
  opacity:.95;
}

/* =========================================================
   TANGGAL
========================================================= */

.date-card{
  background:#fff;
  border-radius:24px;
  margin-top:20px;
  margin-bottom:16px;
  padding:22px 15px;
  text-align:center;
  box-shadow:0 7px 25px rgba(0,0,0,.06);
}

.hari{
  color:#087f5b;
  font-size:30px;
  font-weight:900;
}

.tanggal{
  margin-top:7px;
  color:#777;
  font-size:18px;
}

/* =========================================================
   STATUS GPS
========================================================= */

.location-card{
  background:#fff;
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 7px 25px rgba(0,0,0,.06);
}

.location-title{
  color:#087f5b;
  font-size:20px;
  font-weight:900;
  margin-bottom:10px;
}

.location-status{
  color:#777;
  font-size:16px;
  line-height:1.6;
  text-align:center;
}

.location-status.ok{
  color:#087f5b;
}

.location-status.warning{
  color:#c47a00;
}

.location-status.error{
  color:#d93025;
}

.location-button{
  width:100%;
  min-height:50px;
  margin-top:12px;
  border:1px solid #cfe0da;
  border-radius:15px;
  background:#fff;
  color:#087f5b;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.location-button:active{
  transform:scale(.98);
}

/* =========================================================
   PESAN
========================================================= */

.message{
  display:none;
  margin-bottom:15px;
  padding:14px 16px;
  border-radius:15px;
  font-size:14px;
  line-height:1.5;
}

.message.success{
  display:block;
  background:#e7f8ef;
  color:#087f5b;
}

.message.error{
  display:block;
  background:#ffe8e8;
  color:#d93025;
}

.message.warning{
  display:block;
  background:#fff4dc;
  color:#a56800;
}

/* =========================================================
   LIST GURU
========================================================= */

.guru-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.loading{
  background:#fff;
  border-radius:20px;
  padding:35px 15px;
  text-align:center;
  color:#777;
  font-size:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}

/* =========================================================
   KARTU GURU
========================================================= */

.guru-button{
  width:100%;
  min-height:110px;
  border:0;
  border-radius:20px;
  background:#fff;
  padding:17px 18px;
  text-align:left;
  font-family:inherit;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.06);
  transition:.15s;
}

.guru-button:active{
  transform:scale(.985);
}

.guru-button:disabled{
  cursor:default;
}

.guru-button.sudah{
  background:#eefaf5;
}

.guru-button.bukan-piket{
  background:#fff;
}

.guru-nama{
  display:block;
  color:#075f47;
  font-size:19px;
  line-height:1.3;
  font-weight:900;
}

.guru-jabatan{
  display:block;
  margin-top:5px;
  color:#777;
  font-size:14px;
}

.guru-status{
  display:block;
  margin-top:10px;
  font-size:14px;
  font-weight:700;
}

.status-normal{
  color:#087f5b;
}

.status-success{
  color:#087f5b;
}

.status-disabled{
  color:#999;
}

.status-error{
  color:#d93025;
}

.status-warning{
  color:#c47a00;
}

/* =========================================================
   KEMBALI
========================================================= */

.back-button{
  width:100%;
  min-height:52px;
  margin-top:18px;
  border:0;
  border-radius:16px;
  background:#fff;
  color:#087f5b;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
}

/* =========================================================
   TABLET
========================================================= */

@media(min-width:600px){

  .container{
    padding-left:22px;
    padding-right:22px;
  }

  .header{
    width:calc(100% + 44px);
    margin-left:-22px;
    padding:34px 25px 40px;
  }

  .header h1{
    font-size:36px;
  }

  .header p{
    font-size:21px;
  }

  .guru-nama{
    font-size:20px;
  }
}

/* =========================================================
   HP KECIL
========================================================= */

@media(max-width:380px){

  .container{
    padding-left:11px;
    padding-right:11px;
  }

  .header{
    width:calc(100% + 22px);
    margin-left:-11px;
    padding:24px 13px 30px;
  }

  .header h1{
    font-size:25px;
  }

  .header p{
    font-size:16px;
  }

  .hari{
    font-size:25px;
  }

  .tanggal{
    font-size:16px;
  }

  .guru-nama{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h1>🧑‍🏫 ABSENSI GURU PIKET</h1>
    <p>MTs. BADRIL HUDA</p>
  </div>

  <!-- TANGGAL -->
  <div class="date-card">
    <div id="hari" class="hari">
      Memuat...
    </div>

    <div id="tanggal" class="tanggal">
      Memuat tanggal...
    </div>
  </div>

  <!-- STATUS GPS -->
  <div class="location-card">

    <div class="location-title">
      📍 STATUS LOKASI
    </div>

    <div
      id="locationStatus"
      class="location-status"
    >
      ⏳ Memeriksa lokasi GPS...
    </div>

    <button
      type="button"
      class="location-button"
      onclick="perbaruiLokasi()"
    >
      🔄 PERBARUI LOKASI
    </button>

  </div>

  <!-- PESAN -->
  <div
    id="message"
    class="message"
  ></div>

  <!-- DAFTAR GURU -->
  <div
    id="guruList"
    class="guru-list"
  >
    <div class="loading">
      ⏳ Memuat jadwal guru piket...
    </div>
  </div>

  <!-- KEMBALI -->
  <button
    type="button"
    class="back-button"
    onclick="kembaliGuru()"
  >
    ← KEMBALI KE ABSENSI GURU
  </button>

</div>

<script src="piket.js"></script>

</body>
</html>
