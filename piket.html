<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Absensi Guru Piket</title>

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }


    body {

      background: #f1f7f5;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #123;

      overflow-x: hidden;

    }


    /* =====================================================
       CONTAINER
    ===================================================== */

    .container {

      width: 100%;

      max-width: 760px;

      margin: 0 auto;

      padding:
        0 16px 24px;

    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header {

      width: calc(100% + 32px);

      margin-left: -16px;

      background:
        linear-gradient(
          135deg,
          #087f5b,
          #0aa678
        );

      color: white;

      border-radius:
        0 0 34px 34px;

      padding:
        28px 18px 30px;

      text-align: center;

    }


    .header h1 {

      margin: 0;

      font-size: 30px;

      line-height: 1.15;

      font-weight: 800;

      letter-spacing: .3px;

    }


    .header p {

      margin:
        8px 0 0;

      font-size: 18px;

      line-height: 1.3;

      opacity: .95;

    }


    /* =====================================================
       TANGGAL
    ===================================================== */

    .date-card {

      width: 100%;

      background: white;

      border-radius: 20px;

      padding:
        20px 16px;

      margin-top: 20px;

      margin-bottom: 18px;

      text-align: center;

      box-shadow:
        0 6px 22px
        rgba(0, 0, 0, .06);

    }


    .hari {

      color: #087f5b;

      font-size: 25px;

      line-height: 1.2;

      font-weight: 800;

    }


    .tanggal {

      margin-top: 6px;

      color: #777;

      font-size: 17px;

      line-height: 1.3;

    }


    /* =====================================================
       PESAN
    ===================================================== */

    .message {

      display: none;

      width: 100%;

      margin:
        0 0 15px;

      padding:
        13px 15px;

      border-radius: 13px;

      font-size: 14px;

      line-height: 1.5;

      text-align: left;

    }


    .message.success {

      display: block;

      background: #e8f7f0;

      color: #087f5b;

    }


    .message.error {

      display: block;

      background: #ffe8e8;

      color: #d93025;

    }


    /* =====================================================
       LIST GURU
    ===================================================== */

    .guru-list {

      width: 100%;

      display: flex;

      flex-direction: column;

      gap: 12px;

    }


    /* =====================================================
       KARTU GURU
    ===================================================== */

    .guru-button {

      width: 100%;

      min-height: 105px;

      border: 0;

      border-radius: 18px;

      background: white;

      padding:
        16px 17px;

      margin: 0;

      text-align: left;

      cursor: pointer;

      box-shadow:
        0 5px 18px
        rgba(0, 0, 0, .06);

      transition:
        transform .15s ease,
        box-shadow .15s ease;

      font-family: inherit;

    }


    .guru-button:active {

      transform: scale(.985);

    }


    .guru-button:disabled {

      cursor: default;

    }


    /* =====================================================
       NAMA GURU
    ===================================================== */

    .guru-nama {

      display: block;

      color: #075f47;

      font-size: 18px;

      line-height: 1.25;

      font-weight: 800;

      word-break: normal;

      overflow-wrap: anywhere;

    }


    /* =====================================================
       JABATAN
    ===================================================== */

    .guru-jabatan {

      display: block;

      margin-top: 5px;

      color: #777;

      font-size: 14px;

      line-height: 1.3;

    }


    /* =====================================================
       STATUS
    ===================================================== */

    .guru-status {

      display: block;

      margin-top: 9px;

      font-size: 14px;

      line-height: 1.35;

      font-weight: 600;

    }


    .status-normal {

      color: #087f5b;

    }


    .status-disabled {

      color: #999;

    }


    .status-success {

      color: #087f5b;

    }


    .status-error {

      color: #d93025;

    }


    /* =====================================================
       SUDAH ABSEN
    ===================================================== */

    .guru-button.sudah {

      background: #eefaf5;

      box-shadow:
        0 4px 15px
        rgba(8, 127, 91, .08);

      cursor: default;

    }


    /* =====================================================
       BUKAN PIKET
    ===================================================== */

    .guru-button.bukan-piket {

      background: #ffffff;

      cursor: default;

    }


    /* =====================================================
       LOADING
    ===================================================== */

    .loading {

      width: 100%;

      padding:
        30px 15px;

      text-align: center;

      color: #777;

      font-size: 16px;

    }


    /* =====================================================
       TOMBOL KEMBALI
    ===================================================== */

    .back-button {

      width: 100%;

      min-height: 52px;

      margin-top: 18px;

      border: 0;

      border-radius: 16px;

      padding:
        13px 15px;

      background: white;

      color: #087f5b;

      font-size: 16px;

      font-weight: 700;

      font-family: inherit;

      cursor: pointer;

      box-shadow:
        0 5px 18px
        rgba(0, 0, 0, .05);

    }


    .back-button:active {

      transform: scale(.985);

    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media (min-width: 600px) {

      .container {

        padding:
          0 22px 30px;

      }


      .header {

        width: calc(100% + 44px);

        margin-left: -22px;

        padding:
          32px 25px 34px;

      }


      .header h1 {

        font-size: 34px;

      }


      .header p {

        font-size: 20px;

      }


      .guru-list {

        gap: 14px;

      }


      .guru-button {

        padding:
          18px 20px;

      }


      .guru-nama {

        font-size: 19px;

      }

    }


    /* =====================================================
       HP KECIL
    ===================================================== */

    @media (max-width: 380px) {

      .container {

        padding-left: 11px;

        padding-right: 11px;

      }


      .header {

        width: calc(100% + 22px);

        margin-left: -11px;

        border-radius:
          0 0 28px 28px;

        padding:
          23px 13px 26px;

      }


      .header h1 {

        font-size: 24px;

      }


      .header p {

        font-size: 16px;

      }


      .date-card {

        padding:
          17px 12px;

        border-radius: 17px;

      }


      .hari {

        font-size: 22px;

      }


      .tanggal {

        font-size: 16px;

      }


      .guru-button {

        min-height: 96px;

        padding:
          14px 15px;

        border-radius: 16px;

      }


      .guru-nama {

        font-size: 16px;

      }


      .guru-jabatan {

        font-size: 13px;

      }


      .guru-status {

        font-size: 13px;

      }


      .back-button {

        font-size: 15px;

      }

    }

  </style>

</head>


<body>

  <div class="container">


    <!-- ==================================================
         HEADER
    =================================================== -->

    <div class="header">

      <h1>
        🧑‍🏫 ABSENSI GURU PIKET
      </h1>

      <p>
        MTs. BADRIL HUDA
      </p>

    </div>


    <!-- ==================================================
         TANGGAL
    =================================================== -->

    <div class="date-card">

      <div
        id="hari"
        class="hari"
      >
        Memuat...
      </div>

      <div
        id="tanggal"
        class="tanggal"
      >
        Memuat tanggal...
      </div>

    </div>


    <!-- ==================================================
         PESAN
    =================================================== -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- ==================================================
         DAFTAR GURU
    =================================================== -->

    <div
      id="guruList"
      class="guru-list"
    >

      <div class="loading">
        ⏳ Memuat daftar guru...
      </div>

    </div>


    <!-- ==================================================
         KEMBALI
    =================================================== -->

    <button
      type="button"
      class="back-button"
      onclick="kembaliGuru()"
    >
      ← KEMBALI KE ABSENSI GURU
    </button>

  </div>


  <script>

    // =====================================================
    // URL WEB APP
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxT6SI7IbqBM_yTMvF0sY6EdikgAnyCKnD-R8fWOaOvw4_atZeAWSTN9t3sAYJbgsbP/exec";


    // =====================================================
    // API JSONP
    // =====================================================

    function panggilAPI(
      parameter,
      callback
    ) {

      const callbackName =
        "piketCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 99999
        );


      window[callbackName] =
        function(result) {

          try {

            callback(result);

          }

          finally {

            delete window[
              callbackName
            ];

          }

        };


      const script =
        document.createElement(
          "script"
        );


      const params =
        new URLSearchParams();


      Object.keys(
        parameter
      ).forEach(
        function(key) {

          params.append(
            key,
            parameter[key]
          );

        }
      );


      params.append(
        "callback",
        callbackName
      );


      script.src =
        API_URL +
        "?" +
        params.toString();


      script.onerror =
        function() {

          delete window[
            callbackName
          ];

          tampilkanPesan(
            "Tidak dapat terhubung ke server.",
            "error"
          );

        };


      document.body.appendChild(
        script
      );

    }


    // =====================================================
    // MUAT PIKET
    // =====================================================

    function muatPiket() {

      panggilAPI(
        {
          action:
            "getPiketHariIni"
        },

        function(result) {

          if (
            !result ||
            result.sukses !== true
          ) {

            tampilkanPesan(
              result?.pesan ||
              "Gagal mengambil jadwal piket.",
              "error"
            );

            return;

          }


          document.getElementById(
            "hari"
          ).textContent =
            result.hari;


          document.getElementById(
            "tanggal"
          ).textContent =
            formatTanggal(
              result.tanggal
            );


          tampilkanGuru(
            result.data || []
          );

        }

      );

    }


    // =====================================================
    // TAMPILKAN GURU
    // =====================================================

    function tampilkanGuru(
      data
    ) {

      const list =
        document.getElementById(
          "guruList"
        );


      if (!data.length) {

        list.innerHTML = `
          <div class="loading">
            Tidak ada data guru.
          </div>
        `;

        return;

      }


      let html = "";


      data.forEach(
        function(guru) {

          let statusText =
            "Ketuk untuk absensi";


          let statusClass =
            "status-normal";


          let disabled =
            "";


          let extraClass =
            "";


          if (
            guru.sudahAbsen
          ) {

            statusText =
              "✓ Sudah absen hari ini • " +
              guru.jamAbsen;

            statusClass =
              "status-success";

            disabled =
              "disabled";

            extraClass =
              "sudah";

          }

          else if (
            !guru.punyaJadwal
          ) {

            statusText =
              "Tidak bisa absen hari ini";

            statusClass =
              "status-disabled";

            extraClass =
              "bukan-piket";

          }


          html += `

            <button
              type="button"
              class="guru-button ${extraClass}"
              ${disabled}
              onclick="absenPiket(
                '${escapeJs(guru.kodeQR)}',
                this
              )"
            >

              <span class="guru-nama">
                ${escapeHtml(guru.nama)}
              </span>

              <span class="guru-jabatan">
                ${escapeHtml(guru.jabatan)}
              </span>

              <span
                class="guru-status ${statusClass}"
              >
                ${statusText}
              </span>

            </button>

          `;

        }
      );


      list.innerHTML =
        html;

    }


    // =====================================================
    // ABSENSI
    // =====================================================

    function absenPiket(
      kodeQR,
      button
    ) {

      if (
        button.disabled
      ) {

        return;

      }


      button.disabled =
        true;


      const status =
        button.querySelector(
          ".guru-status"
        );


      if (status) {

        status.textContent =
          "⏳ Memproses absensi...";

      }


      panggilAPI(
        {
          action:
            "absensiPiket",

          kodeQR:
            kodeQR
        },

        function(result) {

          if (
            result &&
            result.sukses === true
          ) {

            button.classList.add(
              "sudah"
            );


            if (status) {

              status.className =
                "guru-status status-success";


              status.textContent =
                "✓ Sudah absen hari ini • " +
                result.jam;

            }


            tampilkanPesan(
              result.pesan,
              "success"
            );


            return;

          }


          if (
            result &&
            result.tidakPiket
          ) {

            button.disabled =
              false;


            if (status) {

              status.className =
                "guru-status status-error";


              status.textContent =
                "✕ Tidak bisa absen hari ini";

            }


            tampilkanPesan(
              result.pesan,
              "error"
            );


            return;

          }


          if (
            result &&
            result.sudahAbsen
          ) {

            button.disabled =
              true;


            button.classList.add(
              "sudah"
            );


            if (status) {

              status.className =
                "guru-status status-success";


              status.textContent =
                "✓ Sudah absen hari ini • " +
                result.jam;

            }


            return;

          }


          button.disabled =
            false;


          if (status) {

            status.className =
              "guru-status status-error";


            status.textContent =
              result?.pesan ||
              "Absensi gagal.";

          }


          tampilkanPesan(
            result?.pesan ||
            "Absensi gagal.",
            "error"
          );

        }

      );

    }


    // =====================================================
    // PESAN
    // =====================================================

    function tampilkanPesan(
      text,
      type
    ) {

      const box =
        document.getElementById(
          "message"
        );


      box.className =
        "message " +
        type;


      box.textContent =
        text;

    }


    // =====================================================
    // FORMAT TANGGAL
    // =====================================================

    function formatTanggal(
      tanggal
    ) {

      const bagian =
        String(
          tanggal
        ).split("-");


      if (
        bagian.length !== 3
      ) {

        return tanggal;

      }


      return new Intl.DateTimeFormat(
        "id-ID",
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      ).format(
        new Date(
          Number(bagian[0]),
          Number(bagian[1]) - 1,
          Number(bagian[2])
        )
      );

    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(
      text
    ) {

      return String(
        text ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =====================================================
    // ESCAPE JAVASCRIPT
    // =====================================================

    function escapeJs(
      text
    ) {

      return String(
        text ?? ""
      )
        .replace(
          /\\/g,
          "\\\\"
        )
        .replace(
          /'/g,
          "\\'"
        )
        .replace(
          /\r/g,
          ""
        )
        .replace(
          /\n/g,
          "\\n"
        );

    }


    // =====================================================
    // KEMBALI
    // =====================================================

    function kembaliGuru() {

      if (
        document.referrer &&
        document.referrer.indexOf(
          location.hostname
        ) !== -1
      ) {

        history.back();

      }

      else {

        window.location.href =
          API_URL;

      }

    }


    // =====================================================
    // MULAI
    // =====================================================

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        muatPiket();

      }
    );

  </script>

</body>

</html>

<script src="piket.js"></script>
