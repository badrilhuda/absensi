<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#087f5b">
<title>REKAP GURU PIKET</title>

<style>

/* ==========================================================
   DASAR
========================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f7f5;
  color:#173f35;
}

body{
  min-height:100vh;
}

.app{
  width:100%;
  max-width:820px;
  margin:auto;
  min-height:100vh;
  background:#f1f7f5;
}


/* ==========================================================
   HEADER
========================================================== */

.header {
  min-height: 145px;
  padding: 28px 25px;

  display: flex;
  align-items: center;
  gap: 18px;

  background: linear-gradient(
    135deg,
    #087f5b,
    #0b986f
  );

  color: white;

  position: relative;
  overflow: hidden;
}


/* ==========================================================
   LENGKUNGAN PUTIH
========================================================== */

.header:after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -105px;

  width: 155%;
  height: 135px;

  transform: translateX(-50%);

  background: #f1f7f5;

  border-radius: 50% 50% 0 0;

  pointer-events: none;
  z-index: 1;
}
   
/* ==========================================================
   LOGO
========================================================== */

.header-icon,
.header-text {
  position: relative;
  z-index: 2;
}
   
.header-icon{
  width:96px;
  height:96px;

  flex:0 0 96px;

  border-radius:24px;

  background:rgba(255,255,255,.16);

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  position:relative;

  z-index:3;
}

.header-icon img{
  width:82px;
  height:82px;

  object-fit:contain;

  display:block;
}


/* ==========================================================
   JUDUL HEADER
========================================================== */

.header-text{
  position:relative;
  z-index:3;
}

.header-text h1{
  margin:0 0 6px;

  font-size:clamp(
    28px,
    6vw,
    48px
  );

  line-height:1;

  font-weight:900;
}

.header-text p{
  margin:0;

  font-size:clamp(
    17px,
    3vw,
    24px
  );
}


/* ==========================================================
   JUDUL HALAMAN
========================================================== */

.page-title{
  display:flex;
  align-items:center;

  gap:18px;

  padding:34px 28px 18px;
}


/* ==========================================================
   TOMBOL KEMBALI
========================================================== */

.back-button{
  width:58px;
  height:58px;

  flex:0 0 58px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;

  border:0;
  border-radius:17px;

  background:#fff;

  color:#087f5b;

  font-size:38px;

  font-weight:900;

  line-height:1;

  cursor:pointer;

  box-shadow:
    0 5px 18px rgba(0,0,0,.07);
}

.back-button:active{
  transform:scale(.93);
}


.page-title h2{
  margin:0;

  color:#087f5b;

  font-size:clamp(
    28px,
    6vw,
    38px
  );

  line-height:1;

  font-weight:900;
}

.page-title span{
  display:block;

  margin-top:7px;

  color:#71807c;

  font-size:17px;
}


/* ==========================================================
   CARD UTAMA
========================================================== */

.content-card{
  margin:12px 24px 30px;

  padding:24px;

  background:#fff;

  border-radius:26px;

  box-shadow:
    0 8px 28px rgba(0,0,0,.06);
}


.card-title{
  color:#087f5b;

  font-size:22px;

  font-weight:900;

  margin-bottom:16px;
}


/* ==========================================================
   FILTER
========================================================== */

.filter-row{
  display:grid;

  grid-template-columns:
    1fr auto;

  gap:12px;

  margin-bottom:18px;
}


.month-input{
  width:100%;

  min-height:52px;

  border:
    1px solid #d8e4df;

  border-radius:14px;

  padding:0 14px;

  background:#f8fbfa;

  color:#17483c;

  font-size:17px;

  outline:0;
}


/* ==========================================================
   TOMBOL
========================================================== */

.primary-button,
.secondary-button{
  min-height:52px;

  border-radius:14px;

  padding:0 20px;

  font-size:15px;

  font-weight:800;

  cursor:pointer;
}


.primary-button{
  border:0;

  background:
    linear-gradient(
      135deg,
      #087f5b,
      #0b986f
    );

  color:#fff;

  box-shadow:
    0 5px 14px
    rgba(8,127,91,.16);
}


.secondary-button{
  border:
    1px solid #cfe0da;

  background:#fff;

  color:#087f5b;
}


/* ==========================================================
   RINGKASAN
========================================================== */

.summary-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:10px;

  margin:18px 0 22px;
}


.summary-box{
  background:#f1f8f5;

  border-radius:16px;

  padding:14px 8px;

  text-align:center;
}


.summary-box strong{
  display:block;

  color:#087f5b;

  font-size:25px;

  line-height:1;

  margin-bottom:7px;
}


.summary-box span{
  color:#71807c;

  font-size:12px;

  font-weight:700;
}


/* ==========================================================
   TABEL
========================================================== */

.table-wrap{
  width:100%;

  overflow-x:auto;

  border-radius:16px;

  border:
    1px solid #e2ebe7;
}


table{
  width:100%;

  min-width:620px;

  border-collapse:collapse;

  background:#fff;
}


th{
  background:#087f5b;

  color:#fff;

  padding:13px 10px;

  font-size:13px;

  text-align:center;

  white-space:nowrap;
}


th:first-child{
  text-align:left;
}


td{
  padding:13px 10px;

  border-bottom:
    1px solid #e7eeeb;

  font-size:14px;

  text-align:center;

  color:#35574e;
}


td:first-child{
  text-align:left;
}


tbody tr:last-child td{
  border-bottom:0;
}


.guru-name{
  display:block;

  color:#075f49;

  font-weight:900;

  line-height:1.25;
}


.guru-nip{
  display:block;

  margin-top:4px;

  color:#8a9793;

  font-size:11px;
}


.num-hadir{
  color:#087f5b;

  font-weight:900;
}


.num-terlambat{
  color:#c47a00;

  font-weight:800;
}


.num-tidak{
  color:#d62d2d;

  font-weight:900;
}


/* ==========================================================
   PESAN
========================================================== */

.message{
  margin:12px 0;

  font-size:14px;
}


.loading,
.empty-box{
  padding:28px 14px;

  text-align:center;

  color:#71807c;

  background:#f7faf9;

  border-radius:16px;
}


.error-box{
  padding:14px 16px;

  border-radius:14px;

  background:#ffe9e9;

  color:#c51f1f;
}


/* ==========================================================
   TOMBOL CETAK
========================================================== */

.action-row{
  display:flex;

  justify-content:flex-end;

  margin-top:16px;
}


/* ==========================================================
   FOOTER
========================================================== */

footer{
  text-align:center;

  padding:15px 20px 30px;

  color:#83908c;

  font-size:13px;
}

footer strong{
  display:block;

  color:#087f5b;

  margin-bottom:3px;
}


/* ==========================================================
   MODE HP
========================================================== */

@media(max-width:600px){

  .header{

    /*
      Sebelumnya 138px.
      Sekarang dibuat lebih tinggi.
    */

    min-height:175px;

    padding:24px 20px 40px;

    gap:14px;
  }


  .header-icon{

    width:82px;

    height:82px;

    flex-basis:82px;

    border-radius:21px;
  }


  .header-icon img{

    width:72px;

    height:72px;
  }


  .header-text h1{

    font-size:
      clamp(
        25px,
        8vw,
        38px
      );
  }


  .header-text p{

    font-size:
      clamp(
        15px,
        4vw,
        20px
      );
  }


  .page-title{

    padding:
      30px 22px 15px;

    gap:16px;
  }


  .back-button{

    width:54px;

    height:54px;

    flex-basis:54px;

    font-size:36px;
  }


  .content-card{

    margin:
      10px 14px 24px;

    padding:18px;

    border-radius:22px;
  }


  .filter-row{

    grid-template-columns:1fr;
  }


  .primary-button{

    width:100%;
  }


  .summary-grid{

    grid-template-columns:
      repeat(2,1fr);
  }

}


/* ==========================================================
   CETAK
========================================================== */

@media print{

  .back-button,
  .filter-row,
  .action-row{

    display:none !important;
  }


  .content-card{

    box-shadow:none;

    margin:10px 0;
  }


  .header{

    -webkit-print-color-adjust:exact;

    print-color-adjust:exact;
  }

}

</style>
</head>

<body>

<div class="app">

  <!-- ======================================================
       HEADER
  ======================================================= -->

  <header class="header">

    <div class="header-icon">

      <img
        src="https://drive.google.com/thumbnail?id=17TLa9x9TYyBQLGVx-d7DlWrNsAVE-v8e&sz=w300"
        alt="Logo MTs Badril Huda"
      >

    </div>


    <div class="header-text">

      <h1>
        ABSENSI GURU
      </h1>

      <p>
        MTs. BADRIL HUDA
      </p>

    </div>

  </header>


  <!-- ======================================================
       JUDUL
  ======================================================= -->

  <div class="page-title">

    <button
      type="button"
      class="back-button"
      onclick="kembali()"
      aria-label="Kembali"
    >
      ←
    </button>


    <div>

      <h2>
        REKAP
      </h2>

      <span>
        ABSENSI GURU PIKET
      </span>

    </div>

  </div>


  <!-- ======================================================
       KONTEN
  ======================================================= -->

  <main class="content-card">

    <div class="card-title">
      📊 REKAP BULANAN GURU PIKET
    </div>


    <div class="filter-row">

      <input
        type="month"
        id="bulanRekap"
        class="month-input"
      >


      <button
        type="button"
        class="primary-button"
        onclick="muatRekap()"
      >
        🔎 TAMPILKAN
      </button>

    </div>


    <div
      id="rekapMessage"
      class="message"
    ></div>


    <!-- ====================================================
         RINGKASAN
    ===================================================== -->

    <div
      id="summary"
      class="summary-grid"
      style="display:none"
    >

      <div class="summary-box">

        <strong id="totalJadwal">
          0
        </strong>

        <span>
          TOTAL JADWAL
        </span>

      </div>


      <div class="summary-box">

        <strong id="totalHadir">
          0
        </strong>

        <span>
          HADIR
        </span>

      </div>


      <div class="summary-box">

        <strong id="totalTerlambat">
          0
        </strong>

        <span>
          TERLAMBAT
        </span>

      </div>


      <div class="summary-box">

        <strong id="totalTidak">
          0
        </strong>

        <span>
          TIDAK HADIR
        </span>

      </div>

    </div>


    <!-- ====================================================
         HASIL REKAP
    ===================================================== -->

    <div id="hasilRekap">

      <div class="empty-box">

        Pilih bulan

        <strong>
          TAMPILKAN
        </strong>.

      </div>

    </div>


    <!-- ====================================================
         CETAK
    ===================================================== -->

    <div class="action-row">

      <button
        type="button"
        class="secondary-button"
        onclick="window.print()"
      >
        🖨️ CETAK
      </button>

    </div>

  </main>


  <!-- ======================================================
       FOOTER
  ======================================================= -->

  <footer>

    <strong>
      MTs. BADRIL HUDA
    </strong>

    A2 Project

  </footer>

</div>


<!-- ========================================================
     JAVASCRIPT
========================================================= -->

<script src="rekap-piket.js"></script>

</body>
</html>
